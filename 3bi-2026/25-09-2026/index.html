<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Pedido</title>
</head>
<body>
    <h1>Calculadora de Pedido</h1>

    <label>Produto:</label>
    <input type="text" id="produto">

    <br><br>

    <label>Preço:</label>
    <input type="number" id="preco" step="0.01">

    <br><br>

    <label>Quantidade:</label>
    <input type="number" id="quantidade">

    <br><br>

    <button onclick="calcularPedido()">Calcular pedido</button>

    <script src="script.js"></script>
</body>
</html>
