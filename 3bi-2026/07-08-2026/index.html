<h2>Suas Playlist</h2>

<div class="playlist">
<img src="images (10).jpg" alt="">
<img src="images (11).jpg" alt="">
<img src="images (12).jpg" alt="">
<img src="images (13).jpg" alt="">
</div>

<style>

.playlist {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    width: 100%;
    gap: 10px;
    max-width: 600px;
}
.musicas-alta {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    max-width: 600px;
}
.grid-imagens {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 600px;
}

.playlist img,
.musicas-alta img {
    width: 100%;
    height: 100px; /* tamanho igual para todas */
    object-fit: cover;
    display: block;
}

.grid-imagens img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
}

</style>
</body>
